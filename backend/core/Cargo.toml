[package]
name = "ocorganize-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
jwalk = "0.8"
parking_lot = "0.12"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
thiserror = "2"

[dev-dependencies]
filetime = "0.2"
tempfile = "3"
